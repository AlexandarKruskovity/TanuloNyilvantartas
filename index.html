<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulói nyilvántartás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <Center><h1>Tanulói nyilvántartás</h1></Center>
    <div class="inputs" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; margin:auto;">
        <input id="knev" placeholder="Vezetéknév">
        <input id="nev" placeholder="Keresztnév">
        
        <input id="osztaly" placeholder="Osztály">
        <input id="tanulmanyiatlag" placeholder="Tanulmányi átlag">
    </div>
    <table id="mytable">
    
    
    <Center><button id="mentes" style="margin:40px; width: 200px;">Mentés</button></Center>
    <center><input type="text" id="myInput" oninput="kereses(event)" placeholder="Tanuló keresése..." title="Type in a name"></center>

    <br>
        
     <table class="student-table" aria-label="Tanulói nyilvántartás" style="width: 80%; margin: auto; border-collapse: collapse; border: 1px solid #ccc;">
        <thead >
            <tr>
                <th>Keresztnév</th>
                <th>Vezetéktnév</th>
                <th>Osztály</th>
                <th>Tanulmányi átlag</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody class="student-table-body" id="student-table-body">
            
            
        </tbody>
    </table>
    


    <Center><h1>Statisztikák</h1></Center>
    
    <div style="display: flex; flex-direction: row;  width: 100%; margin-bottom: 20px; justify-content: center; gap: 200px;">
        
        <div class="statistics" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; border:1px solid; padding: 20px; ">
            <h3 style="text-align: center;">Általános statisztikák</h3>
            <p id="tanulok_szama" style="text-align: center;"></p>
            <p id="osztalyatlag" style="text-align: center;">Osztály átlag: </p>
            <p id="legjobb_tanulo" style="text-align: center;">Legjobb tanuló: </p>
        </div>


        <div class="statistics" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; border:1px solid; padding: 20px;">
            <h3 style="text-align: center;">Jegystatisztikák</h3>
            <p id="jo_tanulo" style="text-align: center;"></p>
            <p id="kozepes_tanulo" style="text-align: center;"></p>
            <p id="elegseges_tanulo" style="text-align: center;"></p>
            <p id="elegtelen_tanulo" style="text-align: center;"></p>
        </div>
    </div>
        
    
    

    <Center><button id="frissit" style="margin:40px; width: 200px;">Frissít</button></Center>

    <div style="display: flex; flex-direction: row;  width: 100%; margin-bottom: 20px; justify-content: center; gap: 20px;">
        <button id="rendezes-atlag-szerint">Rendezés átlag szerint</button>
        <button id="rendezes-nev-szerint">Rendezés név szerint</button>
        <button id="csak-kitunok">Csak kitűnő tanulók</button>
        <button id="beszinezes">Beszínezés</button>
    </div>
    
    <script src="script.js"></script>
    <script src="modositas.js"></script>
   
</body>
</html>
