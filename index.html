<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulói nyilvántartás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <Center><h1>Tanulói nyilvántartás</h1></Center>
    <div class="inputs" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; margin:auto;">
        <input id="nev" placeholder="Keresztnév">
        <input id="knev" placeholder="Vezetéknév">
        <input id="osztaly" placeholder="Osztály">
        <input id="tanulmanyiatlag" placeholder="Tanulmányi átlag">
    </div>
    <table id="mytable">
    
    
    <Center><button id="mentes" style="margin:40px; width: 200px;">Mentés</button></Center>
    <center><input type="text" id="myInput" onkeyup="kereses()" placeholder="Tanuló keresése..." title="Type in a name"></center>

    <br>
        
     <table class="student-table" aria-label="Tanulói nyilvántartás" style="width: 80%; margin: auto; border-collapse: collapse; border: 1px solid #ccc;">
        <thead >
            <tr>
                <th>Keresztnév</th>
                <th>Vezetéktnév</th>
                <th>Osztály</th>
                <th>Tanulmányi átlag</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody class="student-table-body" id="student-table-body">
            
            
        </tbody>
    </table>
    <Center><button id="megsegomb" style="margin:40px; width: 200px;">Mégse</button></Center>


    <Center><h1>Statisztikák</h1></Center>
    <div>
        <div class="statistics" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; margin:auto;">
        <p id="tanulok_szama"></p>
        <p id="osztalyatlag">Osztály átlag: </p>
        <p id="legjobb_tanulo">Legjobb tanuló: </p>
    </div>
    <div class="statistics" style="display: flex; flex-direction: column; gap: 10px; width: 300px; margin-bottom: 20px; margin:auto;">
        <p id="tanulok_szama"></p>
        <p id="osztalyatlag">Osztály átlag: </p>
        <p id="legjobb_tanulo">Legjobb tanuló: </p>
    </div>
    </div>
    

    <button id="frissit">Frissít</button>
    <script src="script.js"></script>
    <script src="modositas.js"></script>
   
</body>
</html>
